<svg class="fl fl-wide" viewBox="-24 -24 1228 480" width="1228" height="480" xmlns="http://www.w3.org/2000/svg" role="img" >
<style>
.fl text { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
.fl-k { font-size: 14px; font-weight: 700; letter-spacing: .14em; fill: #9a988d; }
.fl-t { font-size: 21px; font-weight: 700; fill: #eeede6; }
.fl-s { font-size: 16px; font-weight: 500; fill: #9a988d; }
.fl-tile { fill: #211f19; }
.fl-dac { fill: none; stroke: #eeede6; stroke-width: 2; }
.fl-wire path, .fl-head { fill: none; stroke: #89877c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fl-core { fill: #eeede6; }
.fl .fl-on { fill: #151410; opacity: .75; }
.fl-name { font-size: 32px; font-weight: 800; letter-spacing: -.02em; fill: #151410; }
.fl-mark rect { fill: none; stroke: #151410; stroke-width: 3.4; }
.fl-mark path { fill: #151410; }
.fl-rule { stroke: #151410; stroke-opacity: .25; stroke-width: 1.5; }
.fl-ok { fill: #736b1e; }
.fl-okt { font-size: 18px; font-weight: 700; fill: #736b1e; }
</style>
<rect x="-24" y="-24" width="1228" height="480" rx="14" fill="#151410"/>
          <title id="flow-w-t">What the audiolaz player does</title>
          <desc id="flow-w-d">Sources: Roon, Lyrion, AirPlay, Spotify Connect, UPnP/DLNA and the apps of a Mac or a Linux computer. They go into the audiolaz player, free and open source, which checks the music while it plays: “Bit-perfect, verified”. Outputs, one at a time: your DAC, over USB, HDMI or S/PDIF, or a DAC board; network players: Squeezebox, UPnP/DLNA, AirPlay; an audiolaz Link receiver beside a DAC elsewhere in the house.</desc>
          <text class="fl-k" x="0" y="18">SOURCES</text>
          <text class="fl-k" x="790" y="18">OUTPUTS, ONE AT A TIME</text>
