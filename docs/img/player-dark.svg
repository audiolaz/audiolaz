          <rect class="fl-tile" x="790" y="36" width="390" height="98" rx="5"/><text class="fl-t" x="810" y="76">Your DAC</text><text class="fl-s" x="810" y="106">USB, HDMI, S/PDIF or a DAC board</text>
          <rect class="fl-tile" x="790" y="176" width="390" height="98" rx="5"/><text class="fl-t" x="810" y="216">Network players</text><text class="fl-s" x="810" y="246">Squeezebox, UPnP/DLNA, AirPlay</text>
