          <text class="fl-k fl-on" x="416" y="171">THE PLAYER</text>
          <g class="fl-mark" transform="translate(412 185) scale(0.75)"><rect x="6" y="6" width="36" height="36"/><path d="M24 16l7.2 9-7.2 9-7.2-9z"/></g>
          <text class="fl-name" x="456" y="213">audiolaz</text>
          <text class="fl-s fl-on" x="416" y="241">Free · open source</text>
          <line class="fl-rule" x1="416" y1="259" x2="634" y2="259"/>
          <circle class="fl-ok" cx="421" cy="285" r="5"/><text class="fl-okt" x="436" y="291">Bit-perfect, verified</text>
