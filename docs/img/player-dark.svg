          <rect class="fl-tile" x="0" y="234" width="250" height="48" rx="5"/><text class="fl-t" x="20" y="265">Spotify Connect</text>
          <rect class="fl-tile" x="0" y="300" width="250" height="48" rx="5"/><text class="fl-t" x="20" y="331">UPnP/DLNA</text>
          <rect class="fl-tile" x="0" y="366" width="250" height="48" rx="5"/><text class="fl-t" x="20" y="397">Mac and Linux apps</text>
