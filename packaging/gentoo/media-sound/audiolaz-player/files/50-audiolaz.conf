# The "audiolaz" ALSA output: any application that plays to the PCM "audiolaz" (aplay -D audiolaz, mpv
# --audio-device=alsa/audiolaz...) plays into the audiolaz player, paced by the DAC's clock.
# The plug-in: /usr/lib64/alsa-lib/libasound_module_pcm_azdrv.so (media-sound/audiolaz-player).
pcm.audiolaz {
	type azdrv
	hint {
		show on
		description "audiolaz (the player's input)"
	}
}
